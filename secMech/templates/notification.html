{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intrusion Alerts</title>
  <link rel="stylesheet" href="{% static 'stylesheet2.css' %}">
  <link rel="stylesheet" href="{% static 'fontawesome-free-5.15.2-web/css/all.css' %}">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    #armButton {
      display: none;
      background-color: #f44336;
      color: white;
      transition: background-color 0.3s ease;
    }
    #armButton.disarmed {
      background-color: #4CAF50;
    }
    #statusText {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      padding: 10px;
    }
    nav div{
      margin-left: -400px;
    }
    .list-icons i{
      color: yellow;
    }
  </style>
  </style>
</head>

<body>
  <nav>
    <i class="fas fa-bars" id="btn"></i>
    <div id="sub-menu">
      <label style="background: red;">
        <h2>Menu</h2>
        <i class="fas fa-times" id="btn2"></i>
      </label>

      <ul style="text-align: center;" class="list-icons">
        <a href="index"><li><i class="fas fa-home"></i> Homepage</li></a>
        <a href="report"><li><i class="fas fa-stream"></i> Report</li></a>
        <a href="subpages/index.html"><li><i class="fas fa-bell"></i> Notifications</li></a>
        <a href="subpages/Temp.html"><li><i class="fas fa-bullhorn"></i> Alarm System</li></a>
        <a href="{% url 'logout' %}"><li><i class="fas fa-user"></i> Logout</li></a>
      </ul>
    </div>
    <label><h2>INTRUSIONS</h2></label>
  </nav>

  <button id="armButton">Loading...</button>
  <br />

   <section class="report">
    <div id="live-video">
      <img src="http://192.168.43.1:8080/video" alt="Live Security Camera Feed" width="480" height="430">
        
</video>
     <br />
      <audio src="http://192.168.43.1:8080/audio.wav" controls></audio>
    </div>

    <div id="col-2">
      <table id="alarmTable" class="intrusions">
        <thead>
          <td colspan="100%" style="background: red;">IR Alarm Logs</td>
          <tr>
            <td style="background: red;">Index</td>
            <td style="background: red;">Date</td>
            <td style="background: red;">Time</td>
            <td style="background: red;">Footage</td>
          </tr>
        </thead>
        <tbody id="alarmBody"></tbody>
      </table>
    </div>
  </section>

  <!-- 🔥 Firebase Logic -->
  <script>
    // 🔐 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDSjW0Y0Dnt0sr0fJHd9AZ5O25z_k8hx2Y",
      authDomain: "lightbulb-ef4f6.firebaseapp.com",
      databaseURL: "https://lightbulb-ef4f6-default-rtdb.firebaseio.com",
      projectId: "lightbulb-ef4f6",
      storageBucket: "lightbulb-ef4f6.firebasestorage.app",
      messagingSenderId: "959447705364",
      appId: "1:959447705364:web:3692367ed8c54653638401",
      measurementId: "G-9E2PH1L39F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const armButton = document.getElementById("armButton");
    const statusText = document.getElementById("statusText");

    // ==== UI Update Function ====
    function updateUI(isArmed) {
      if (isArmed) {
        armButton.textContent = "Disarm System";
        armButton.classList.remove("disarmed");
        statusText.textContent = "System is ARMED";
        statusText.style.color = "#f44336";
      } else {
        armButton.textContent = "Arm System";
        armButton.classList.add("disarmed");
        statusText.textContent = "System is DISARMED";
        statusText.style.color = "#4CAF50";
      }
    }

    // ✅ Real-time listener to /armed
    db.ref("/armed").on("value", (snapshot) => {
      const isArmed = snapshot.val();
      if (isArmed !== null) {
        updateUI(isArmed);
        armButton.style.display = "block";
      }
    });

    // ✅ Arm Button toggle
    armButton.addEventListener("click", () => {
      db.ref("/armed").once("value").then((snap) => {
        const current = snap.val();
        const newStatus = !current;

        db.ref("/armed").set(newStatus);
        db.ref("log/status").set(newStatus);

        const now = new Date();
        const date = now.toISOString().split("T")[0];
        const time = now.toTimeString().split(" ")[0];
        const timestamp = now.getTime();

        const newLogRef = db.ref("/log").push();
        newLogRef.set({
          date: date,
          time: time,
          status: newStatus,
          method: "Web",
          footage: "null",
          timestamp: timestamp
        });
      });
    });

    // ==== 🚨 Log IR Intrusions into /alarms ====
   db.ref("/intrusions").on("child_added", (snapshot) => {
  const data = snapshot.val();

  // ✅ Only log IR intrusions into /alarms
  if (data.sensor === "IR") {
    const alarmRef = db.ref("/alarms").push();
    const timestamp = new Date(data.timestamp || Date.now());
    const date = timestamp.toLocaleDateString();
    const time = timestamp.toLocaleTimeString();

    alarmRef.set({
      date: date,
      time: time,
      footage: "N/A" // Replace with actual footage URL if available
    });
  }
});


    // ==== 🧾 Display /alarms table ====
// ==== 🧾 Display /alarms table ====
const alarmBody = document.getElementById("alarmBody");

db.ref("/alarms").on("value", (snapshot) => {
  const alarms = snapshot.val();
  alarmBody.innerHTML = ""; // Clear table first

  if (alarms) {
    const entries = Object.values(alarms).slice(-5); // Last 5 logs
    entries.forEach((alarm, i) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i + 1}</td>
        <td>${alarm.date || "-"}</td>
        <td>${alarm.time || "-"}</td>
        <td>${alarm.footage || "None"}</td>
      `;
      alarmBody.appendChild(row);
    });
  }
});

  </script>

  <!-- 🧭 Sidebar Script -->
  <script>
    document.getElementById("btn").addEventListener("click", function () {
      const sidebar = document.getElementById("sub-menu");
      sidebar.style.marginLeft = "0px";
      sidebar.style.transition = "0.9s";
    });

    document.getElementById("btn2").addEventListener("click", function () {
      const sidebar = document.getElementById("sub-menu");
      sidebar.style.marginLeft = "-400px";
    });
  </script>
</body>
</html>
